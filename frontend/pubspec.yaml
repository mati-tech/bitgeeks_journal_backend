name: trading_journal
description: "AI-powered trading journal — Flutter web + mobile."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Pickers
  image_picker: ^1.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
